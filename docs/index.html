<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>bepop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><a class="brand" href="./" aria-label="bepop home">bepop</a></header>
  <div class="search-shell">
    <form id="searchForm" role="search" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <input id="search" type="search" placeholder="Search a song…" aria-label="Search MVP songs" role="combobox" aria-autocomplete="list" aria-controls="results" aria-expanded="false" spellcheck="false">
      <button class="search-submit" aria-label="Search" title="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
    </form>
    <div id="searchMessage" role="status" hidden></div>
    <ul id="results" role="listbox" aria-label="Matching MVP songs" hidden></ul>
  </div>
  <main id="stage" hidden>
    <section class="record-column" aria-label="Song layers and playback">
      <div id="record" class="record">
        <svg id="onion" viewBox="0 0 600 600" role="group" aria-label="Song sections on the full-song timeline"></svg>
        <button id="hub" class="hub" title="Play whole song" aria-label="Play whole song"><span id="hubArtist"></span><strong id="hubTitle"></strong><span id="hubDuration"></span></button>
      </div>
      <div class="transport">
        <div class="seek-wrap"><div id="selectedRange" class="selected-range" hidden></div><input id="timeline" type="range" min="0" max="1" step="0.01" value="0" aria-label="Song progress" disabled></div>
        <div class="transport-row">
          <time id="currentTime">0:00</time>
          <div class="transport-buttons">
            <button id="back" class="skip" title="Back 5 seconds" aria-label="Back 5 seconds" disabled><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M7 8a9 9 0 1 1-2 11M7 3v6H1"/><text x="13.5" y="18">5</text></svg></button>
            <button id="play" class="play" title="Play" aria-label="Play" disabled><svg id="playShape" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg></button>
            <button id="forward" class="skip" title="Forward 5 seconds" aria-label="Forward 5 seconds" disabled><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M21 8a9 9 0 1 0 2 11M21 3v6h6"/><text x="14.5" y="18">5</text></svg></button>
          </div>
          <time id="totalTime">0:00</time>
        </div>
      </div>
    </section>
    <aside id="details" aria-label="Selected section details" hidden></aside>
  </main>
  <audio id="audio" preload="none"></audio>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
