<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bepop</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header id="topBar">
      <div id="brand">bepop</div>
      <div id="searchWrap">
        <input id="searchInput" type="text" placeholder="Search a song…" autocomplete="off" spellcheck="false" />
        <button id="searchBtn" aria-label="Search" title="Search">&#8594;</button>
        <ul id="suggestions" hidden></ul>
        <div id="noMatches" hidden>No matches</div>
      </div>
    </header>

    <main id="homeScreen"></main>

    <main id="songView" hidden>
      <div id="songMeta">
        <div id="songTitleGroup">
          <span id="songTitle"></span>
          <span id="loadingNote" hidden>Loading…</span>
        </div>
        <div id="volumeControl" title="Volume">
          <span id="volumeIcon" aria-hidden="true">&#128266;</span>
          <div id="volumeTrack" role="slider" tabindex="0" aria-label="Volume"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <div id="volumeFill"></div>
          </div>
        </div>
      </div>

      <div id="stage">
        <div id="waveformColumn">
          <div id="waveformBox">
            <div id="waveform"></div>
          </div>
          <div id="transportControls">
            <button id="backBtn" title="Back 5 seconds">&#8722;5 s</button>
            <button id="playPauseBtn" title="Play/Pause">&#9658;</button>
            <button id="fwdBtn" title="Forward 5 seconds">+5 s</button>
          </div>
          <p id="selectionHint">Drag on the waveform to select a range and find similar songs.</p>
        </div>

        <aside id="analysisPanel" hidden>
          <button id="closePanelBtn" aria-label="Close" title="Close (Esc)">&times;</button>
          <h2 id="matchesHeading">Similar songs</h2>
          <ol id="matches" class="matchList"></ol>

          <div id="matchDetail" hidden>
            <button id="backToMatchesBtn">&#8592; Back</button>
            <h2 id="matchDetailTitle"></h2>

            <div id="clipButtons">
              <button id="playOriginalClipBtn" class="clipBtn">&#9658; Play your selection</button>
              <button id="playMatchClipBtn" class="clipBtn">&#9658; Play the match</button>
            </div>

            <div class="alignTrack">
              <div class="alignTrackLabel">Chord progression</div>
              <div id="chordAlignRows" class="alignRows"></div>
              <p id="chordAlignCaption" class="alignCaption" hidden></p>
            </div>

            <div class="alignTrack">
              <div class="alignTrackLabel">Melody</div>
              <div id="noteContour" class="contourGraph"></div>
              <div class="contourLineLegend">
                <span class="lineKeySelection">Your selection</span>
                <span class="lineKeyMatch">Matched song</span>
              </div>
            </div>

            <div class="alignLegend">
              <span class="legendMatch">Same</span>
              <span class="legendSub">Similar, not exact</span>
              <span class="legendGap">No match here</span>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <!-- wavesurfer.js v7 (UMD), pinned version - see docs/README.md -->
  <script src="https://cdn.jsdelivr.net/npm/wavesurfer.js@7.12.12/dist/wavesurfer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/wavesurfer.js@7.12.12/dist/plugins/regions.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
