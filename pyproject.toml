[project]
name = "midi-recommendation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "demucs>=4.1.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "mido>=1.3.3",
    "pretty-midi>=0.2.11",
    "mir-eval>=0.8.2",
    "numpy>=1.26.4",
    "basic-pitch>=0.4.0",
    "vamp>=1.1.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.extra-build-dependencies]
vamp = ["numpy"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
