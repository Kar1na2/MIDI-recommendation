[project]
name = "midi-recommendation"
version = "0.1.0"
description = "Beat-grid rhythm compression and timestamped Genius lyric sections"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "demucs==4.1.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "mido==1.3.3",
    "pretty-midi==0.2.11.post0",
    "numpy==2.2.6",
    "scipy==1.17.1",
    "soundfile==0.14.0",
    "librosa==0.11.0",
    "beat-this==1.1.0",
    "madmom",
    "muscriptor==0.4.0",
    "PyYAML==6.0.3",
    "beautifulsoup4==4.15.0",
    "rapidfuzz==3.14.6",
    "matplotlib==3.11.2",
    "korean-romanizer==0.28.0",
    "pykakasi==2.3.0",
    "requests==2.32.5",
    "lyricsgenius==3.6.4",
]

[project.optional-dependencies]
utilities = ["music21==10.5.0", "spotipy==2.26.0", "yt-dlp==2026.10.26"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
muscriptor = { git = "https://github.com/muscriptor/muscriptor.git", rev = "8a1ef88672cc23c26619adaff37ec48d82c0b906" }
madmom = { git = "https://github.com/CPJKU/madmom.git", rev = "27f032e8947204902c675e5e341a3faf5dc86dae" }
torch = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
